spring.application.name=master
# DB接続情報
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql:fleamarket
spring.datasource.username=student
spring.datasource.password=himitu
# SQL実行出力
spring.jpa.show-sql=true

# =====================================================================
# 【一時設定】DB（テーブル）がまだ無い間でも Web サーバを起動できるようにする。
#   ログイン認証・物品一覧はモック（仮データ）で動作する。
#   DB 構築後は、この区切り内を削除（または見直し）し、各 @Primary モック
#   （AuthServiceMock / ItemListServiceMock）を外せば DB アクセス版に戻る。
# ---------------------------------------------------------------------
# 起動時に DB へ接続できなくても失敗させない（接続は遅延・リトライ）
spring.datasource.hikari.initialization-fail-timeout=-1
# DB 未接続でも方言を確定する（接続なしで JDBC メタデータを参照しない）
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# 自動 DDL・初期 SQL は実行しない（DB 未構築のため）
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
# =====================================================================
