<!DOCTYPE html>
<!--/*
  item-101 : トップ／物品一覧画面（Thymeleaf テンプレート）
  画面設計：「2. トップ（物品一覧）画面」/ 共通メニュー（サイドバー・ヘッダー）＋物品一覧
  ※ 本画面（item-101）専用。他画面へのリンクはダミー（href="#"）とし、結合時に差し替える。
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トップ／物品一覧｜フリマ社内システム</title>
  <link rel="stylesheet" th:href="@{/css/item101.css}" href="../static/css/item101.css">
</head>
<body>

<div class="layout">

  <!-- ===== サイドバー（共通メニュー：他画面へのリンクはダミー） ===== -->
  <aside class="sidebar">
    <div class="brand">フリマ社内システム</div>
    <nav>
      <!-- TODO: 並行開発中の各画面と結合する（現在はダミーURL） -->
      <a class="nav active" href="#" th:href="@{/item-101}">🏠 ホーム</a>
      <a class="nav" href="#"><!--/* TODO: item-102 検索画面と結合 */-->🔍 検索</a>
      <a class="nav" href="#"><!--/* TODO: item-103 出品画面と結合 */-->➕ 出品</a>
      <a class="nav" href="#"><!--/* TODO: item-104 メッセージ画面と結合 */-->✉️ メッセージ</a>
      <a class="nav" href="#"><!--/* TODO: item-106 マイページ画面と結合 */-->👤 マイページ</a>
    </nav>
  </aside>

  <!-- ===== メイン ===== -->
  <div class="main">

    <!-- ヘッダー -->
    <header class="topbar">
      <div class="page-title">物品一覧</div>
      <div class="topbar-right">
        <span class="bell" title="通知">🔔<!--/* TODO: 通知一覧画面と結合 */--></span>
        <span class="user" th:text="${loginUser != null ? loginUser.name : 'ゲスト'}">テスト 太郎</span>
        <!-- TODO: 並行開発中のログイン機能（ログアウト）と結合する -->
        <a class="logout" href="#">ログアウト</a>
      </div>
    </header>

    <div class="content">

      <!-- 検索・絞り込み -->
      <form class="search-bar" method="get" th:action="@{/item-101}" th:object="${searchForm}">
        <div class="search-box">
          <input type="text" name="keyword" th:field="*{keyword}"
                 placeholder="キーワード検索（商品名・説明）">
          <button type="submit" class="icon-btn">🔍</button>
        </div>

        <div class="filters">
          <!-- カテゴリ -->
          <select name="category_id" th:field="*{category_id}">
            <option value="">すべてのカテゴリ</option>
            <option th:each="c : ${categories}"
                    th:value="${c.category_id}"
                    th:text="${c.name}">カテゴリ</option>
          </select>

          <!-- 状態 -->
          <select name="status" th:field="*{status}">
            <option value="">すべての状態</option>
            <option value="出品中">出品中</option>
            <option value="成約済み">成約済み</option>
            <option value="譲渡完了">譲渡完了</option>
          </select>

          <!-- 並び順（期限タブ相当） -->
          <select name="sort" th:field="*{sort}">
            <option value="newest">新着順</option>
            <option value="deadline">期限が近い順</option>
          </select>

          <button type="submit" class="btn">検索</button>
        </div>
      </form>

      <!-- 件数 -->
      <div class="result-head">
        <span>検索結果：<strong th:text="${resultCount}">0</strong> 件</span>
        <!-- TODO: 並行開発中の item-103 出品画面と結合する -->
        <a class="btn primary" href="#">＋ 出品する</a>
      </div>

      <!-- 物品一覧（カード） -->
      <div class="grid" th:if="${resultCount > 0}">
        <!-- TODO: item-107 物品詳細画面と結合する（現在はダミーリンク。item_id を渡す想定） -->
        <a class="card" th:each="item : ${items}" href="#"
           th:attr="data-item-id=${item.item_id}">
          <div class="thumb">
            <img th:if="${item.thumbnailUrl != null}" th:src="${item.thumbnailUrl}" alt="商品画像">
            <span th:unless="${item.thumbnailUrl != null}" class="no-image">NO IMAGE</span>
            <span class="status-badge" th:text="${item.status}">出品中</span>
          </div>
          <div class="card-body">
            <div class="cat" th:text="${item.categoryName}">カテゴリ</div>
            <div class="name" th:text="${item.name}">商品名</div>
            <div class="meta">
              <span class="price" th:text="${item.priceLabel}">¥1,500</span>
              <span class="deadline"
                    th:classappend="${item.expired} ? ' expired'"
                    th:text="${item.expired} ? '期限切れ'
                             : (${item.remainingDays != null} ? '残り' + ${item.remainingDays} + '日' : '-')">
                残り5日
              </span>
            </div>
            <div class="cond" th:text="${item.condition}">中古</div>
          </div>
        </a>
      </div>

      <!-- 0件表示（例外系：検索結果が0件） -->
      <div class="empty" th:if="${resultCount == 0}">
        該当する物品がありません。
      </div>

    </div>
  </div>
</div>

</body>
</html>
