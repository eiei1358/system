<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン｜フリマ社内システム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f3f5f8;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: #1f2733;
    }
    .login-card {
      background: #fff; width: 360px; max-width: 92vw;
      border: 1px solid #dfe3eb; border-radius: 12px;
      padding: 28px 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.05);
    }
    .brand { text-align: center; font-weight: 700; color: #1f6feb; font-size: 18px; margin-bottom: 4px; }
    .title { text-align: center; font-size: 22px; font-weight: 700; margin: 0 0 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 5px; }
    .field input {
      width: 100%; height: 40px; padding: 0 12px;
      border: 1px solid #cdd4df; border-radius: 8px; font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #1f6feb; }
    .btn-login {
      width: 100%; height: 42px; margin-top: 6px;
      background: #1f6feb; color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-login:hover { background: #1858c4; }
    .error {
      background: #ffeef0; border: 1px solid #f5c2c7; color: #d1242f;
      border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <!-- LoginController: POST /login（@RequestParam email, password / model "error"）に対応 -->
  <form class="login-card" method="post" th:action="@{/login}">
    <div class="brand">フリマ社内システム</div>
    <h1 class="title">ログイン</h1>

    <!-- 認証エラー表示（LoginController が model に "error" を設定した場合のみ） -->
    <div class="error" th:if="${error}" th:text="${error}">
      メールアドレスまたはパスワードが違います。
    </div>

    <div class="field">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required autofocus
             placeholder="example@company.co.jp">
    </div>

    <div class="field">
      <label for="password">パスワード</label>
      <input type="password" id="password" name="password" required
             placeholder="パスワード">
    </div>

    <button type="submit" class="btn-login">ログイン</button>
  </form>
</body>
</html>
