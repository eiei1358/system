spring.application.name=master

# =====================================================================
# 【既定】組み込みDB（H2）モード：外部DB不要でそのまま起動できる。
#   起動時に schema.sql でテーブル作成 → TestDataInitializer がサンプル投入 →
#   実SQLで集計（StatisticsServiceImpl）。インポートして実行するだけで動く。
# =====================================================================
spring.datasource.url=jdbc:h2:mem:fleamarket;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 起動時に schema.sql を実行してテーブル作成
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# H2コンソール（http://localhost:8080/h2-console でDBの中身を確認できる）
spring.h2.console.enabled=true

# 実DB集計を使う（モックではなく本物のSQL集計）
app.use-mock-statistics=false
# 起動時に検証用サンプルデータを投入
app.seed-test-data=true

