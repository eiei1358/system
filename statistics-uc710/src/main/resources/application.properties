spring.application.name=master

# === DB接続情報（DBで動かす場合：チームのスキーマSQLで構築済みの free_market123 に接続） ===
# ※ 検証用にホスト/ポートを変える場合は jdbc:postgresql://host:port/free_market123 とする
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql:free_market123
spring.datasource.username=student
spring.datasource.password=himitu

# === 動作確認モード（DB不要） ===
# true（既定）：DBに繋がなくても、モックの統計データで画面・グラフを表示できる。
#               import 後そのまま ./gradlew bootRun で Web サーバが起動する。
# false：本物の DB 集計を使う（PostgreSQL の free_market123 が必要）。
app.use-mock-statistics=true
# DB 投入用サンプルデータ（DBモードのときのみ有効。モック時は失敗しても無視される）
app.seed-test-data=true

# --- DB が無くても起動を失敗させないための設定 ---
# 起動時に DB へ接続できなくても失敗させない（接続は遅延）
spring.datasource.hikari.initialization-fail-timeout=-1
# DB 未接続でも方言を確定（接続なしでメタデータ参照しない）
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# 自動 DDL・初期 SQL は実行しない
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=false
