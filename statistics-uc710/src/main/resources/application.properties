spring.application.name=master

# === DB接続情報（PostgreSQL：チームのDB free_market123 に接続） ===
# ※ ホスト/ポートを変える場合は jdbc:postgresql://host:port/free_market123 とする
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql:free_market123
spring.datasource.username=student
spring.datasource.password=himitu

# === データベースモード（既定） ===
# false：本物の DB 集計（StatisticsServiceImpl）を使う。← 既定はこちら
# true ：DB を使わずモックの固定値で表示（DBが無い時の確認用）
app.use-mock-statistics=false

# 起動時に検証用サンプルデータを投入（既存データが十分あればスキップ）
app.seed-test-data=true

# 起動時に schema.sql を実行してテーブルを作成（無ければ作成、あればスキップ）
spring.sql.init.mode=always
# JPA の自動DDLは使わない（テーブルは schema.sql / チームのSQLで作成）
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
