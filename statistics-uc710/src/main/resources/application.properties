spring.application.name=master

# === DB接続情報（チームのスキーマSQLで構築済みの free_market123 に接続） ===
# ※ 検証用にホスト/ポートを変える場合は jdbc:postgresql://host:port/free_market123 とする
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql:free_market123
spring.datasource.username=student
spring.datasource.password=himitu

# DDL・初期SQLはチームのスキーマSQLで作成済みのため実行しない
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=false

# === UC-710 検証用サンプルデータの自動投入（true で起動時に投入） ===
# 本番でサンプルを入れたくない場合は false にする
app.seed-test-data=true
