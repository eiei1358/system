<!DOCTYPE html>
<!--/* UC-710 統計情報（管理者）：Twitterアナリティクス風ダッシュボード。Chart.js 4.4.8＋datalabels。 */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計情報｜フリマ社内システム</title>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#f7f9fb;color:#0f1419;
         font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;}
    .topbar{background:#fff;border-bottom:1px solid #eaecef;padding:16px 28px;
            display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
    .topbar h1{font-size:20px;margin:0;font-weight:800;}
    .topbar .sub{font-size:12px;color:#536471;margin-top:2px;}
    .topbar .user{font-size:13px;color:#536471;}
    .wrap{max-width:1080px;margin:0 auto;padding:22px 24px 60px;}

    /* 期間バー */
    .period{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
            background:#fff;border:1px solid #eaecef;border-radius:14px;padding:14px 18px;margin-bottom:18px;}
    .period label{display:block;font-size:11px;color:#536471;margin-bottom:4px;font-weight:600;}
    .period input,.period select{border:1px solid #cfd9de;border-radius:10px;padding:8px 12px;font-size:14px;}
    .period .go{border:none;background:#1d9bf0;color:#fff;border-radius:9999px;
                padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;}
    .period .go:hover{background:#1a8cd8;}

    /* KPIカード */
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
    .kpi{background:#fff;border:1px solid #eaecef;border-radius:16px;padding:18px 20px;}
    .kpi .label{font-size:13px;color:#536471;font-weight:600;}
    .kpi .value{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-top:6px;line-height:1;}
    .kpi .unit{font-size:15px;color:#536471;font-weight:600;margin-left:4px;}
    .kpi.accent .value{color:#1d9bf0;}

    /* カード（グラフ） */
    .card{background:#fff;border:1px solid #eaecef;border-radius:16px;padding:18px 20px;margin-bottom:18px;}
    .card h2{font-size:15px;margin:0 0 4px;font-weight:800;}
    .card .desc{font-size:12px;color:#536471;margin-bottom:14px;}
    .chart-box{position:relative;height:320px;}
    .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
    @media(max-width:820px){.grid2{grid-template-columns:1fr;}.kpis{grid-template-columns:1fr;}}

    table.detail{border-collapse:collapse;width:100%;margin-top:10px;}
    table.detail th,table.detail td{border-bottom:1px solid #eff3f4;padding:8px 10px;font-size:13px;text-align:left;}
    table.detail th{color:#536471;font-weight:600;}
    table.detail td.num{text-align:right;font-variant-numeric:tabular-nums;}
    .empty{background:#fff8e6;border:1px solid #f1d58a;color:#9a6700;border-radius:14px;
           padding:28px;text-align:center;font-size:14px;}
    .legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>統計情報</h1>
      <div class="sub">出品・成約の利用状況をグラフで確認できます（UC-710）</div>
    </div>
    <span class="user" th:text="${loginUser != null ? loginUser.name + ' / 管理者' : ''}">管理者</span>
  </div>

  <div class="wrap">

    <!-- 期間 -->
    <form class="period" method="get" th:action="@{/admin/statistics}" th:object="${searchForm}">
      <div><label>開始日</label><input type="date" th:field="*{startDate}"></div>
      <div><label>終了日</label><input type="date" th:field="*{endDate}"></div>
      <div><label>時系列の粒度</label>
        <select th:field="*{granularity}">
          <option value="month">月別</option>
          <option value="day">日別</option>
        </select>
      </div>
      <div><button class="go" type="submit">更新</button></div>
    </form>

    <!-- データなし -->
    <div class="empty" th:if="${!result.hasData}">対象期間に該当するデータがありません。</div>

    <div th:if="${result.hasData}">
      <!-- KPIカード -->
      <div class="kpis">
        <div class="kpi">
          <div class="label">出品数</div>
          <div class="value"><span th:text="${result.listingCount}">0</span><span class="unit">件</span></div>
        </div>
        <div class="kpi">
          <div class="label">成約数</div>
          <div class="value"><span th:text="${result.dealCount}">0</span><span class="unit">件</span></div>
        </div>
        <div class="kpi accent">
          <div class="label">成約率</div>
          <div class="value"><span th:text="${result.dealRate}">0</span><span class="unit">%</span></div>
        </div>
      </div>

      <!-- 時系列（メイン折れ線） -->
      <div class="card">
        <h2>時系列の推移</h2>
        <div class="desc">
          <span class="legend-dot" style="background:#1d9bf0"></span>出品数
          <span class="legend-dot" style="background:#00ba7c;margin-left:12px"></span>成約数
        </div>
        <div class="chart-box"><canvas id="timeChart"></canvas></div>
      </div>

      <!-- カテゴリ別（棒）＋表 -->
      <div class="grid2">
        <div class="card">
          <h2>カテゴリ別</h2>
          <div class="desc">カテゴリごとの出品数・成約数</div>
          <div class="chart-box"><canvas id="categoryChart"></canvas></div>
        </div>
        <div class="card">
          <h2>カテゴリ別 明細</h2>
          <div class="desc">数値での比較</div>
          <table class="detail">
            <thead><tr><th>カテゴリ</th><th style="text-align:right">出品</th><th style="text-align:right">成約</th><th style="text-align:right">成約率</th></tr></thead>
            <tbody>
              <tr th:each="c : ${result.categoryStats}">
                <td th:text="${c.categoryName}">IT機器</td>
                <td class="num" th:text="${c.listingCount}">0</td>
                <td class="num" th:text="${c.dealCount}">0</td>
                <td class="num" th:text="${c.listingCount > 0} ? ${#numbers.formatDecimal(c.dealCount * 100.0 / c.listingCount,1,1)} + '%' : '-'">0%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Chart.js（参考実装に準拠：4.4.8 ＋ datalabels） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <script type="text/javascript" th:inline="javascript">
    /*<![CDATA[*/
    const hasData = /*[[${result.hasData}]]*/ false;
    const timeLabels       = /*[[${timeLabels}]]*/ [];
    const timeListings     = /*[[${timeListings}]]*/ [];
    const timeDeals        = /*[[${timeDeals}]]*/ [];
    const categoryLabels   = /*[[${categoryLabels}]]*/ [];
    const categoryListings = /*[[${categoryListings}]]*/ [];
    const categoryDeals    = /*[[${categoryDeals}]]*/ [];

    const BLUE = '#1d9bf0', GREEN = '#00ba7c';

    if (hasData) {
      // 時系列（折れ線・面塗り）
      new Chart(document.getElementById('timeChart'), {
        type: 'line',
        plugins: [ChartDataLabels],
        data: {
          labels: timeLabels,
          datasets: [
            { label:'出品数', data:timeListings, borderColor:BLUE, backgroundColor:'rgba(29,155,240,.12)',
              borderWidth:2, fill:true, tension:.35, pointRadius:3 },
            { label:'成約数', data:timeDeals, borderColor:GREEN, backgroundColor:'rgba(0,186,124,.12)',
              borderWidth:2, fill:true, tension:.35, pointRadius:3 }
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          scales:{ y:{ beginAtZero:true, ticks:{precision:0} } },
          plugins:{ legend:{display:false},
            datalabels:{ align:'top', color:'#536471', font:{weight:'bold',size:10} } }
        }
      });

      // カテゴリ別（棒）
      new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        plugins: [ChartDataLabels],
        data: {
          labels: categoryLabels,
          datasets: [
            { label:'出品数', data:categoryListings, backgroundColor:BLUE, borderRadius:6 },
            { label:'成約数', data:categoryDeals, backgroundColor:GREEN, borderRadius:6 }
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          scales:{ y:{ beginAtZero:true, ticks:{precision:0} } },
          plugins:{ legend:{position:'top'},
            datalabels:{ anchor:'end', align:'top', color:'#0f1419', font:{weight:'bold',size:10} } }
        }
      });
    }
    /*]]>*/
  </script>
</body>
</html>
