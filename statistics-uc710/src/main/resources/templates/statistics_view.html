<!DOCTYPE html>
<!--/* UC-710 統計情報閲覧（管理者）。Chart.js でカテゴリ別=棒グラフ／時系列=折れ線グラフ。 */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計情報｜フリマ社内システム</title>
  <!-- Chart.js（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#f4f6fa; color:#1f2733;
           font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
    .header { background:#fff; border-bottom:1px solid #dfe3eb; padding:14px 24px; display:flex;
              align-items:center; justify-content:space-between; }
    .header h1 { font-size:18px; margin:0; }
    .header .user { font-size:13px; color:#6b7480; }
    .wrap { padding:22px 24px; max-width:1000px; }
    .panel { background:#fff; border:1px solid #dfe3eb; border-radius:10px; padding:16px 18px; margin-bottom:18px; }
    .panel h2 { font-size:14px; margin:0 0 12px; }
    .cond { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
    .cond label { display:block; font-size:12px; color:#4b5563; margin-bottom:4px; }
    .cond select, .cond input { border:1px solid #cdd4df; border-radius:8px; padding:8px 10px; font-size:14px; }
    .btn { border:none; background:#1f6feb; color:#fff; border-radius:8px; padding:9px 16px;
           font-size:14px; font-weight:600; cursor:pointer; }
    table.summary { border-collapse:collapse; width:100%; max-width:420px; }
    table.summary th, table.summary td { border:1px solid #e7eaf0; padding:9px 14px; text-align:left; font-size:14px; }
    table.summary th { background:#f7f9fc; width:120px; }
    table.summary td .rate { font-weight:700; color:#1f6feb; }
    table.detail { border-collapse:collapse; width:100%; margin-top:12px; }
    table.detail th, table.detail td { border:1px solid #e7eaf0; padding:8px 12px; font-size:13px; text-align:left; }
    table.detail th { background:#f7f9fc; }
    .empty { background:#fff8e6; border:1px solid #f1d58a; color:#9a6700; border-radius:8px;
             padding:24px; text-align:center; font-size:14px; }
    .chart-box { position:relative; height:340px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>統計情報の閲覧（UC-710）</h1>
    <span class="user" th:text="${loginUser != null ? loginUser.name + ' / 管理者' : ''}">管理者（モック） / 管理者</span>
  </div>

  <div class="wrap">

    <!-- ===== 集計条件 ===== -->
    <div class="panel">
      <h2>集計条件</h2>
      <form class="cond" method="get" th:action="@{/admin/statistics}" th:object="${searchForm}">
        <div>
          <label>集計の観点</label>
          <select th:field="*{viewType}">
            <option value="overall">全体（出品数・成約数・成約率）</option>
            <option value="category">カテゴリ別</option>
            <option value="timeseries">時系列</option>
          </select>
        </div>
        <div>
          <label>開始日</label>
          <input type="date" th:field="*{startDate}">
        </div>
        <div>
          <label>終了日</label>
          <input type="date" th:field="*{endDate}">
        </div>
        <div>
          <label>粒度（時系列）</label>
          <select th:field="*{granularity}">
            <option value="month">月別</option>
            <option value="day">日別</option>
          </select>
        </div>
        <div><button class="btn" type="submit">集計する</button></div>
      </form>
    </div>

    <!-- ===== 全体サマリ（常に表示） ===== -->
    <div class="panel">
      <h2>集計結果（全体）</h2>
      <table class="summary">
        <tr><th>出品数</th><td th:text="${result.listingCount} + ' 件'">0 件</td></tr>
        <tr><th>成約数</th><td th:text="${result.dealCount} + ' 件'">0 件</td></tr>
        <tr><th>成約率</th><td><span class="rate" th:text="${result.dealRate} + ' %'">0 %</span></td></tr>
      </table>
    </div>

    <!-- ===== データなし ===== -->
    <div class="panel" th:if="${!result.hasData}">
      <div class="empty">該当するデータがありません。</div>
    </div>

    <!-- ===== カテゴリ別（棒グラフ＋表） ===== -->
    <div class="panel" th:if="${result.hasData and searchForm.viewType == 'category'}">
      <h2>カテゴリ別</h2>
      <div class="chart-box"><canvas id="categoryChart"></canvas></div>
      <table class="detail">
        <thead><tr><th>カテゴリ</th><th>出品数</th><th>成約数</th></tr></thead>
        <tbody>
          <tr th:each="c : ${result.categoryStats}">
            <td th:text="${c.categoryName}">IT機器</td>
            <td th:text="${c.listingCount}">0</td>
            <td th:text="${c.dealCount}">0</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ===== 時系列（折れ線グラフ＋表） ===== -->
    <div class="panel" th:if="${result.hasData and searchForm.viewType == 'timeseries'}">
      <h2>時系列の推移</h2>
      <div class="chart-box"><canvas id="timeChart"></canvas></div>
      <table class="detail">
        <thead><tr><th>期間</th><th>出品数</th><th>成約数</th></tr></thead>
        <tbody>
          <tr th:each="p : ${result.timeSeries}">
            <td th:text="${p.label}">2026/03</td>
            <td th:text="${p.listingCount}">0</td>
            <td th:text="${p.dealCount}">0</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- ===== Chart.js 描画 ===== -->
  <script th:inline="javascript">
    /*<![CDATA[*/
    const viewType      = /*[[${searchForm.viewType}]]*/ 'overall';
    const hasData       = /*[[${result.hasData}]]*/ false;
    const categoryStats = /*[[${result.categoryStats}]]*/ [];
    const timeSeries    = /*[[${result.timeSeries}]]*/ [];

    if (hasData && viewType === 'category') {
      new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
          labels: categoryStats.map(c => c.categoryName),
          datasets: [
            { label: '出品数', data: categoryStats.map(c => c.listingCount), backgroundColor: '#90caf9' },
            { label: '成約数', data: categoryStats.map(c => c.dealCount),    backgroundColor: '#1f6feb' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false,
                   scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    }

    if (hasData && viewType === 'timeseries') {
      new Chart(document.getElementById('timeChart'), {
        type: 'line',
        data: {
          labels: timeSeries.map(p => p.label),
          datasets: [
            { label: '出品数', data: timeSeries.map(p => p.listingCount), borderColor: '#90caf9', backgroundColor: '#90caf9', tension: 0.3 },
            { label: '成約数', data: timeSeries.map(p => p.dealCount),    borderColor: '#1f6feb', backgroundColor: '#1f6feb', tension: 0.3 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false,
                   scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    }
    /*]]>*/
  </script>
</body>
</html>
